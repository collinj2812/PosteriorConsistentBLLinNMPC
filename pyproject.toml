[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcbll"
version = "1.0.0"
description = "Posterior-consistent scenario trees for BLL surrogates in multi-stage NMPC"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "torch>=2.1",
    "casadi>=3.6",
    "do-mpc>=4.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pcbll*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore:The opcua feature is not available:UserWarning",
]
